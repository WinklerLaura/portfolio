# Checks every pull request: builds the website and runs the automatic tests
# (desktop and phone) before anything can be merged and go live.
name: Checks

on:
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Build the website
        run: npm run build

      - name: Install the test browser
        run: npx playwright install --with-deps chromium

      - name: Run the checks
        run: npx playwright test
