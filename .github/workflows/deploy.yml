# Builds the website and uploads it to World4You every time something changes on main.
# The login is stored in GitHub: Settings > Secrets and variables > Actions.
name: Deploy to World4You

on:
  push:
    branches: [main]
  workflow_dispatch: # adds a "Run workflow" button in the Actions tab

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build the website
        run: npm run build

      - name: Install the upload tool
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Upload to World4You (SFTP)
        env:
          SFTP_SERVER: ${{ secrets.FTP_SERVER }}
          SFTP_USER: ${{ secrets.FTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -c "set sftp:auto-confirm yes; set net:timeout 20; set net:max-retries 2; \
            open -u \"$SFTP_USER\",\"$SFTP_PASSWORD\" -p 22 sftp://$SFTP_SERVER; \
            mirror --reverse --verbose dist/ ./"
